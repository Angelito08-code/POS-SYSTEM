<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>R-TECH COMPUTER CENTER POS SYSTEM</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    .header { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .container { display: flex; gap: 20px; }
    .left-col { flex: 1.3; background: #fff; padding: 20px; border-radius: 8px; }
    .right-col { flex: 1; background: #fff; padding: 20px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    button { padding: 6px 12px; margin: 2px; cursor: pointer; }
    .btn-primary { background: #007bff; color: white; border: none; border-radius: 4px; }
    .btn-danger { background: #dc3545; color: white; border: none; border-radius: 4px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 8px 0; }
    input, select { padding: 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
    .receipt { font-family: monospace; white-space: pre-wrap; background: #fff; padding: 15px; border: 1px solid #ccc; width: 300px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h2 id="store-title">R-TECH COMPUTER CENTER</h2>
      <span id="store-info">Loading info...</span>
    </div>
  </div>

  <div class="container">
    <!-- Left Column: Search & Catalog -->
    <div class="left-col">
      <h3>🔍 Search & Add to Cart</h3>
      <input type="text" id="barcode-input" placeholder="Scan barcode or type item name..." onkeypress="handleScan(event)">

      <h4>Items Catalog</h4>
      <table id="items-table">
        <thead>
          <tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Right Column: Cart & Checkout -->
    <div class="right-col">
      <h3>🛒 Current Order</h3>
      <button class="btn-danger" onclick="clearCart()">Clear Cart</button>

      <label>Customer Type</label>
      <select id="customer-type" onchange="renderCart()">
        <option value="Regular Customer">Regular Customer</option>
        <option value="Government Customer">Government Customer</option>
      </select>

      <input type="text" id="si-number" placeholder="SI Number (Sales Invoice #)">
      <input type="text" id="customer-name" placeholder="Customer Name">

      <div id="cart-list"></div>
      <hr>

      <div>Subtotal: ₱<span id="subtotal">0.00</span></div>
      <div>Tax: ₱<span id="tax">0.00</span></div>
      <h3>TOTAL DUE: ₱<span id="total-due">0.00</span></h3>

      <label>Cash Tendered</label>
      <input type="number" id="cash-tendered" value="0" oninput="calculateChange()">
      <div>Change: ₱<span id="change-amount">0.00</span></div>
      <br>

      <button class="btn-primary" style="width:100%; padding: 12px;" onclick="checkout()">✔ COMPLETE SALE / CHECKOUT</button>
    </div>
  </div>

  <script>
    let itemsData = [];
    let cart = [];
    let settings = {};

    async function loadSettings() {
      const res = await fetch('/api/settings');
      settings = await res.json();
      document.getElementById('store-title').innerText = settings.store_name;
      document.getElementById('store-info').innerText = `TIN: ${settings.tin_number} | Services Tax: ${settings.tax_rate_services}% | Inventory Tax: ${settings.tax_rate_inventory}%`;
    }

    async function loadItems() {
      const res = await fetch('/api/items');
      itemsData = await res.json();
      const tbody = document.querySelector('#items-table tbody');
      tbody.innerHTML = '';
      itemsData.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td>${item.category}</td>
            <td>₱${item.price.toFixed(2)}</td>
            <td>${item.stock === -1 ? 'Unli' : item.stock}</td>
            <td><button class="btn-primary" onclick="addToCart(${item.id})">➕ Add</button></td>
          </tr>
        `;
      });
    }

    function addToCart(id) {
      const item = itemsData.find(i => i.id === id);
      if (!item) return;

      if (item.category !== 'Services' && item.stock === 0) {
        alert('Item is out of stock!');
        return;
      }

      const cartItem = cart.find(c => c.id === id);
      if (cartItem) {
        if (item.category !== 'Services' && item.stock !== -1 && cartItem.qty >= item.stock) {
          alert('Stock limit reached.');
          return;
        }
        cartItem.qty++;
      } else {
        cart.push({ ...item, qty: 1, subtotal: item.price });
      }
      renderCart();
    }

    function renderCart() {
      const cartDiv = document.getElementById('cart-list');
      cartDiv.innerHTML = '';
      let subtotal = 0;
      let taxServices = 0;
      let taxInventory = 0;

      const isGov = document.getElementById('customer-type').value === 'Government Customer';

      cart.forEach((item, index) => {
        item.subtotal = item.price * item.qty;
        subtotal += item.subtotal;

        if (isGov) {
          if (item.category === 'Services') {
            taxServices += item.subtotal * (settings.tax_rate_services / 100);
          } else {
            taxInventory += item.subtotal * (settings.tax_rate_inventory / 100);
          }
        }

        cartDiv.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              <small>₱${item.price.toFixed(2)} x ${item.qty}</small>
            </div>
            <div>
              <button onclick="changeQty(${index}, 1)">➕</button>
              <button onclick="changeQty(${index}, -1)">➖</button>
            </div>
          </div>
        `;
      });

      const totalTax = taxServices + taxInventory;
      const totalDue = subtotal + totalTax;

      document.getElementById('subtotal').innerText = subtotal.toFixed(2);
      document.getElementById('tax').innerText = totalTax.toFixed(2);
      document.getElementById('total-due').innerText = totalDue.toFixed(2);

      calculateChange();
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function clearCart() {
      cart = [];
      renderCart();
    }

    function calculateChange() {
      const totalDue = parseFloat(document.getElementById('total-due').innerText);
      const cash = parseFloat(document.getElementById('cash-tendered').value) || 0;
      const change = cash - totalDue;
      document.getElementById('change-amount').innerText = change >= 0 ? change.toFixed(2) : '0.00';
    }

    function handleScan(e) {
      if (e.key === 'Enter') {
        const query = e.target.value.toLowerCase().trim();
        const found = itemsData.find(i => (i.barcode && i.barcode === query) || i.name.toLowerCase().includes(query));
        if (found) {
          addToCart(found.id);
          e.target.value = '';
        } else {
          alert('Item not found');
        }
      }
    }

    async function checkout() {
      const siNumber = document.getElementById('si-number').value;
      const customerName = document.getElementById('customer-name').value || 'Walk-in';
      const totalDue = parseFloat(document.getElementById('total-due').innerText);
      const cash = parseFloat(document.getElementById('cash-tendered').value) || 0;

      if (!siNumber) return alert('Please enter an SI Number');
      if (cash < totalDue) return alert('Insufficient Cash');

      const saleData = {
        date_time: new Date().toISOString().replace('T', ' ').substring(0, 19),
        si_number: siNumber,
        customer_name: customerName,
        total: totalDue,
        items: cart
      };

      const res = await fetch('/api/sales', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(saleData)
      });

      if (res.ok) {
        alert('Sale completed successfully!');
        clearCart();
        loadItems();
      } else {
        alert('Error completing sale');
      }
    }

    loadSettings();
    loadItems();
  </script>
</body>
</html>
